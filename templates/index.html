<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conditional Statement Compiler</title>
<style>
  :root {
    --bg: #f8fafc;
    --panel-bg: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --font-code: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    padding: 2rem 1.5rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-main);
  }

  header p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 0.25rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  @media (max-width: 850px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
  }

  .panel-title {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .panel-body {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  textarea {
    width: 100%;
    min-height: 380px;
    font-family: var(--font-code);
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-main);
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.75rem;
    resize: vertical;
    outline: none;
  }

  textarea:focus {
    border-color: var(--primary);
  }

  .controls {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  button, select {
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    cursor: pointer;
  }

  button:hover, select:hover {
    background: #f1f5f9;
  }

  .btn-primary {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
    font-weight: 500;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .status-box {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    background: #fafafa;
  }

  .status-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: block;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.025em;
  }

  .status-value {
    font-size: 0.95rem;
    font-weight: 600;
    margin-top: 0.15rem;
    display: block;
  }

  .status-box.ok {
    border-color: #bbf7d0;
    background: var(--success-bg);
    color: var(--success);
  }

  .status-box.fail {
    border-color: #fecaca;
    background: var(--danger-bg);
    color: var(--danger);
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.75rem;
    gap: 0.25rem;
  }

  .tab {
    border: none;
    background: none;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    border-radius: 0;
  }

  .tab:hover {
    color: var(--text-main);
    background: none;
  }

  .tab.active {
    color: var(--primary);
    font-weight: 600;
    border-bottom-color: var(--primary);
    background: none;
  }

  pre {
    font-family: var(--font-code);
    font-size: 0.85rem;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.75rem;
    min-height: 290px;
    max-height: 480px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: #1e293b;
    flex-grow: 1;
  }

  .shortcut-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  kbd {
    background: #e2e8f0;
    border-radius: 3px;
    padding: 0.1rem 0.3rem;
    font-family: var(--font-code);
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Compiler Front End — Conditional Statements</h1>
    <p>Lexical, syntax, and semantic validator for if, if-else, and nested conditions</p>
  </header>

  <div class="layout">
    <!-- Input Panel -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">Source Code</span>
        <span class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to compile</span>
      </div>
      <div class="panel-body">
        <textarea id="source" spellcheck="false" placeholder="Write code here..."></textarea>
        <div class="controls">
          <button id="compileBtn" class="btn-primary">Compile</button>
          <select id="examples">
            <option value="">Load Example...</option>
            <option value="ifelse">Simple if-else</option>
            <option value="nested">Nested if-else</option>
            <option value="syntax">Syntax error</option>
            <option value="semantic">Semantic error</option>
          </select>
          <button id="clearBtn">Clear</button>
        </div>
      </div>
    </section>

    <!-- Results Panel -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">Analysis Results</span>
      </div>
      <div class="panel-body">
        <div class="status-grid">
          <div class="status-box" id="ph-lexical">
            <span class="status-label">Lexical</span>
            <span class="status-value">—</span>
          </div>
          <div class="status-box" id="ph-syntax">
            <span class="status-label">Syntax</span>
            <span class="status-value">—</span>
          </div>
          <div class="status-box" id="ph-semantic">
            <span class="status-label">Semantic</span>
            <span class="status-value">—</span>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-key="output">Summary</button>
          <button class="tab" data-key="tokens">Tokens</button>
          <button class="tab" data-key="parse_tree">Parse Tree</button>
          <button class="tab" data-key="ast">AST</button>
          <button class="tab" data-key="symbol_table">Symbol Table</button>
        </div>

        <pre id="result">Click "Compile" to run analysis.</pre>
      </div>
    </section>
  </div>
</div>

<script>
  const examples = {
    ifelse: "int a;\nint b;\na = 5;\nif (a > 10) {\n    b = 20;\n} else {\n    b = 30;\n}\n",
    nested: "int a;\nint b;\na = 5;\nif (a > 10) {\n    if (b < 20) {\n        a = 6;\n    } else {\n        a = 7;\n    }\n} else {\n    b = 30;\n}\n",
    syntax: "int a;\nif (a > 10 {\n    a = 1;\n}\n",
    semantic: "int a;\nif (a < b) {\n    a = 1;\n}\n"
  };

  const src = document.getElementById('source');
  const result = document.getElementById('result');
  const btn = document.getElementById('compileBtn');
  let data = null;
  let activeKey = 'output';

  src.value = examples.nested;

  function setPhase(name, value) {
    const el = document.getElementById('ph-' + name);
    const textEl = el.querySelector('.status-value');
    const v = value || '—';
    textEl.textContent = v;
    el.className = 'status-box ' + (v === 'Successful' ? 'ok' : v === 'Failed' ? 'fail' : '');
  }

  function render() {
    if (!data) return;
    const text = data[activeKey];
    result.textContent = text && text.length ? text : '(No data available for this phase)';
  }

  async function compile() {
    btn.disabled = true;
    btn.textContent = 'Compiling...';
    try {
      const res = await fetch('/compile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: src.value })
      });
      data = await res.json();
      if (data.error) data.output = data.error;
    } catch (e) {
      data = { output: 'Failed to connect to server: ' + e.message };
    }
    setPhase('lexical', data.lexical);
    setPhase('syntax', data.syntax);
    setPhase('semantic', data.semantic);
    render();
    btn.disabled = false;
    btn.textContent = 'Compile';
  }

  btn.addEventListener('click', compile);
  src.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); compile(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = src.selectionStart;
      src.value = src.value.slice(0, s) + '    ' + src.value.slice(src.selectionEnd);
      src.selectionStart = src.selectionEnd = s + 4;
    }
  });

  document.getElementById('examples').addEventListener('change', e => {
    if (examples[e.target.value]) src.value = examples[e.target.value];
    e.target.value = '';
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    src.value = '';
    src.focus();
  });

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeKey = t.dataset.key;
    render();
  }));
</script>
</body>
</html>
